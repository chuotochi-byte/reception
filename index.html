<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>受付 | 中央土地建物有限会社</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">

<!-- 起動タップ画面（音声ロック解除用） -->
<div id="screen-start"
  ontouchstart="event.preventDefault();document.getElementById('screen-start').style.display='none';"
  onclick="document.getElementById('screen-start').style.display='none';">
  <p class="start-title">タップして開始</p>
  <p class="start-sub">受付システムを起動します</p>
</div>

<div id="app">

  <!-- ① 待機画面 -->
  <div id="screen-idle" class="screen">
    <div class="logo-wrap">
      <img src="logo.png" alt="中央土地建物有限会社" class="company-logo"
        onload="document.getElementById('co-name').style.opacity='0.5'"
        onerror="this.style.display='none'">
      <p id="co-name" class="co-name">中央土地建物有限会社</p>
    </div>
    <p class="welcome">いらっしゃいませ</p>
    <p class="announce-body">そのままお名前・ご用件・ご連絡先を<br>口頭でお話しください</p>
  </div>

  <!-- ② 録音中画面 -->
  <div id="screen-recording" class="screen">
    <p class="announce-title">いらっしゃいませ</p>
    <p class="announce-body">そのままお名前・ご用件・ご連絡先を<br>口頭でお話しください</p>
    <div class="mic-wave" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="rec-hint">録音中 — 話し終わったら送信ボタンを押してください</p>
  </div>

  <!-- ③ 送信中 -->
  <div id="screen-uploading" class="screen">
    <div class="spinner"></div>
    <p class="sending-text">送信中...</p>
  </div>

  <!-- ④ 完了画面 -->
  <div id="screen-done" class="screen">
    <div class="done-check">✓</div>
    <p class="done-title">後ほどご連絡いたします</p>
    <p class="done-sub">お電話またはSMSにてご連絡いたします</p>
  </div>

  <!-- ⑤ スリープ画面（17:00〜9:00） -->
  <div id="screen-sleep" class="screen">
    <div class="sleep-moon">🌙</div>
    <p class="sleep-title">本日の受付は終了いたしました</p>
    <p class="sleep-sub">受付時間　9:00〜17:00</p>
    <p class="sleep-clock" id="sleep-clock"></p>
  </div>

</div>

<!-- 常時表示ボタン -->
<div id="btn-area">
  <button id="btn-send" class="btn-gold btn-xl">担当者へ送信する</button>
  <p class="btn-hint">この送信ボタンを押すと担当者へ伝達いたします</p>
</div>

<video id="motion-video" muted playsinline style="display:none"></video>
<button id="door-trigger" style="position:fixed;top:0;left:0;width:80px;height:80px;opacity:0;z-index:9999;"></button>

<script src="config.js?v=4"></script>
<script src="app.js?v=4"></script>

</body>
</html>
